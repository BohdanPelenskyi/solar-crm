<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SOLAR CRM</title>
  <desc id="desc">Blue app icon with a sun and solar panel grid.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1239A8"/>
    </linearGradient>
    <linearGradient id="sun" x1="256" y1="116" x2="256" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0B1E69" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bg)"/>

  <!-- Sun -->
  <g fill="url(#sun)">
    <rect x="244" y="84" width="24" height="58" rx="12"/>
    <rect x="132" y="150" width="24" height="58" rx="12" transform="rotate(-45 144 179)"/>
    <rect x="356" y="150" width="24" height="58" rx="12" transform="rotate(45 368 179)"/>
    <rect x="94" y="242" width="58" height="24" rx="12"/>
    <rect x="360" y="242" width="58" height="24" rx="12"/>
    <path d="M176 278c0-56 35-102 80-102s80 46 80 102v10H176z"/>
  </g>

  <!-- Solar panel -->
  <g filter="url(#shadow)">
    <path d="M132 306c3-14 15-24 30-24h188c15 0 27 10 30 24l28 126c4 18-10 34-28 34H132c-18 0-32-16-28-34z" fill="#EFF6FF"/>
    <path d="M256 292v164M151 365h210M144 421h224" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
    <path d="M197 292l-18 164M315 292l18 164" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Spark -->
  <circle cx="256" cy="372" r="18" fill="#FBBF24"/>
</svg>
